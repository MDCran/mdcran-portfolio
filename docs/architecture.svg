<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">mdcran portfolio monorepo architecture</title>
  <desc id="desc">The web and API applications share UI, database, and configuration packages in a pnpm and Turborepo workspace.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#18181b"/><stop offset="1" stop-color="#312e81"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c4b5fd"/></marker></defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="70" y="78" fill="#fafafa" font-family="Arial,sans-serif" font-size="32" font-weight="700">mdcran-portfolio</text><text x="70" y="112" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="17">One workspace for the personal site and its services</text>
  <g filter="url(#shadow)" font-family="Arial,sans-serif"><rect x="70" y="190" width="250" height="170" rx="18" fill="#7c3aed"/><text x="102" y="242" fill="white" font-size="23" font-weight="700">apps/web</text><text x="102" y="276" fill="#ede9fe" font-size="17">Next.js 15</text><text x="102" y="310" fill="#ede9fe" font-size="15">Public portfolio</text><rect x="480" y="190" width="250" height="170" rx="18" fill="#db2777"/><text x="512" y="242" fill="white" font-size="23" font-weight="700">apps/api</text><text x="512" y="276" fill="#fce7f3" font-size="17">Hono + Node</text><text x="512" y="310" fill="#fce7f3" font-size="15">Jobs and webhooks</text><rect x="895" y="130" width="235" height="125" rx="18" fill="#0891b2"/><text x="925" y="182" fill="white" font-size="21" font-weight="700">packages/ui</text><text x="925" y="216" fill="#cffafe" font-size="15">Shared components</text><rect x="895" y="295" width="235" height="125" rx="18" fill="#059669"/><text x="925" y="347" fill="white" font-size="21" font-weight="700">packages/db</text><text x="925" y="381" fill="#d1fae5" font-size="15">Prisma + typed client</text></g>
  <path d="M320 275H480 M730 240 895 192 M730 310 895 355" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="379" y="255" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="14">workspace scripts</text><text x="772" y="202" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="14">shared imports</text><text x="772" y="344" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="14">shared imports</text>
</svg>
